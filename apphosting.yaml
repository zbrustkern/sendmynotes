# Firebase App Hosting Configuration
# Documentation: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# Environment variables and Cloud Secret Manager bindings
# Secrets are managed via Google Cloud Secret Manager and never committed to git.
env:
  # Sensitive Server-Only Secrets (Backed by Google Cloud Secret Manager)
  - variable: STRIPE_SECRET_KEY
    secret: stripe-secret-key
    availability:
      - RUNTIME

  - variable: STRIPE_WEBHOOK_SECRET
    secret: stripe-webhook-secret
    availability:
      - RUNTIME

  - variable: HANDWRYTTEN_API_KEY
    secret: handwrytten-api-key
    availability:
      - RUNTIME

  - variable: GEMINI_API_KEY
    secret: gemini-api-key
    availability:
      - RUNTIME

  - variable: META_CONVERSIONS_API_ACCESS_TOKEN
    secret: meta-conversions-api-access-token
    availability:
      - RUNTIME

  - variable: RESEND_API_KEY
    secret: resend-key
    availability:
      - RUNTIME

  # Public client configuration
  - variable: NEXT_PUBLIC_APP_URL
    value: https://sendmynotes.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_GA4_MEASUREMENT_ID
    value: G-5DV25FZ7Q8
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_GOOGLE_TAG_ID
    value: GT-TNPN256B
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_GOOGLE_ADS_ID
    value: AW-18474411963
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_GOOGLE_ADS_CONVERSION_LABEL
    value: RAmzCLzyvKodELvPpOlE
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_META_PIXEL_ID
    value: "1773518093991339"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_META_DOMAIN_VERIFICATION
    value: "7j8rbkz9ktc5jzapl53uueqvute5et"
    availability:
      - BUILD
      - RUNTIME

  - variable: ENABLE_INTERNATIONAL_MAILING
    value: "true"
    availability:
      - BUILD
      - RUNTIME

  # Account private storage. Reminder delivery stays disabled until inbox proof.
  - variable: UPLOAD_PRIVATE_BUCKET
    value: sendmynotes-2a417-upload-private
    availability: [RUNTIME]
  - variable: UPLOAD_IMAGE_MODEL
    value: gemini-nano-banana-2.1
    availability: [RUNTIME]
  - variable: UPLOAD_ADMIN_EMAILS
    value: zbrustkern@gmail.com,sentral@gmail.com
    availability: [RUNTIME]
  - variable: UPLOAD_CLEANUP_SECRET
    secret: upload-cleanup-secret@1
    availability: [RUNTIME]
  - variable: ADMIN_SESSION_SIGNING_KEY
    secret: admin-session-signing-key@1
    availability: [RUNTIME]
  - variable: REMINDER_WORKER_SECRET
    secret: reminder-worker-secret@1
    availability: [RUNTIME]
  - variable: ACCOUNT_REMINDER_DELIVERY_ACTIVE
    value: "false"
    availability: [RUNTIME]
