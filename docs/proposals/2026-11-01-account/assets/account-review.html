<div id="smn-account-review" aria-label="SendMyNotes account design">
  <style>
    #smn-account-review{--paper:light-dark(#faf8f3,#1d2522);--surface:light-dark(#fffefa,#28322d);--ink:light-dark(#263c33,#f3f1e8);--quiet:light-dark(#657269,#bdc8c0);--line:light-dark(#dedfd4,#4c5c51);--forest:light-dark(#284e3c,#c7e1c9);--onforest:light-dark(#fffef6,#203429);--soft:light-dark(#edf1e8,#34483b);--gold:light-dark(#f1e5cd,#51442e);--danger:light-dark(#973e35,#ffb8ad);font-family:Arial,Helvetica,sans-serif;color:var(--ink);font-size:14px;line-height:1.5;isolation:isolate;min-width:0}
    #smn-account-review *{box-sizing:border-box}#smn-account-review [hidden]{display:none!important}
    #smn-account-review h1,#smn-account-review h2,#smn-account-review h3,#smn-account-review p{margin:0}
    #smn-account-review h1{font:400 34px/1.16 Georgia,serif;letter-spacing:-.8px;margin:6px 0 10px}
    #smn-account-review h2{font:400 23px/1.25 Georgia,serif;margin-bottom:10px}#smn-account-review h3{font-size:15px;font-weight:500}
    #smn-account-review button,#smn-account-review input,#smn-account-review select,#smn-account-review textarea{font:inherit}
    #smn-account-review button{cursor:pointer;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:44px}
    #smn-account-review button:hover{background:var(--soft)}#smn-account-review button:focus-visible,#smn-account-review input:focus-visible,#smn-account-review select:focus-visible,#smn-account-review textarea:focus-visible{outline:3px solid var(--forest);outline-offset:3px}
    #smn-account-review button.primary{background:var(--forest);color:var(--onforest);border-color:var(--forest)}
    #smn-account-review button.link{border:0;background:transparent;padding-left:0;padding-right:0;text-decoration:underline;text-underline-offset:4px}
    #smn-account-review .app{background:var(--paper);min-height:780px}
    #smn-account-review .reviewbar{font-size:12px;color:var(--quiet);padding:8px 18px;background:var(--soft);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
    #smn-account-review .top{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;position:relative;background:var(--surface)}
    #smn-account-review .brand{font:400 23px Georgia,serif;letter-spacing:-.5px;flex:1}
    #smn-account-review .mainmenu{position:absolute;top:76px;right:24px;width:235px;padding:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 15px 35px #0002;z-index:4;border-radius:12px}
    #smn-account-review .mainmenu button{display:block;width:100%;text-align:left;border:0}
    #smn-account-review .shell{display:grid;grid-template-columns:188px minmax(0,1fr)}
    #smn-account-review .sidebar{border-right:1px solid var(--line);padding:28px 15px}
    #smn-account-review .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--quiet);font-weight:500}
    #smn-account-review .identity{padding:0 12px 20px}
    #smn-account-review .identity strong{font-weight:500;display:block;margin-top:4px}
    #smn-account-review nav button{border:0;background:transparent;width:100%;display:flex;gap:10px;text-align:left;margin:3px 0;align-items:center}
    #smn-account-review nav button[aria-current=page]{background:var(--soft);font-weight:500;color:var(--forest)}
    #smn-account-review nav i{width:17px;height:17px}#smn-account-review .navmobile{display:none}
    #smn-account-review .main{padding:32px;min-width:0}
    #smn-account-review .sub{color:var(--quiet);max-width:520px}
    #smn-account-review .section{margin-top:30px}#smn-account-review .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}#smn-account-review .between{justify-content:space-between}
    #smn-account-review .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
    #smn-account-review .hero{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:25px;align-items:center;padding-bottom:25px;border-bottom:1px solid var(--line)}
    #smn-account-review .hero .art{width:135px;transform:rotate(4deg);box-shadow:4px 6px 0 var(--gold)}
    #smn-account-review .art{width:100%;aspect-ratio:17/22;object-fit:cover;background:var(--soft);display:block;border-radius:3px}
    #smn-account-review .listrow{display:flex;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
    #smn-account-review .grow{flex:1;min-width:0}#smn-account-review .small{font-size:12px;color:var(--quiet)}
    #smn-account-review .dateblock{width:48px;flex-shrink:0;text-align:center;color:var(--forest)}#smn-account-review .dateblock span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px}#smn-account-review .dateblock b{font:400 26px Georgia,serif}
    #smn-account-review .pill{display:inline-block;font-size:12px;background:var(--soft);color:var(--ink);padding:4px 8px;border-radius:5px}
    #smn-account-review .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
    #smn-account-review .tile{min-width:0}#smn-account-review .tile .art{margin-bottom:12px}#smn-account-review .tile h3{margin-bottom:4px}#smn-account-review .tile button{margin-top:10px}
    #smn-account-review .tile .source{aspect-ratio:1;object-fit:contain;padding:12px;background:var(--gold)}
    #smn-account-review .seg{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0}
    #smn-account-review .seg button{background:transparent;border-color:transparent;padding:8px 12px}
    #smn-account-review .seg button[aria-pressed=true]{background:var(--forest);color:var(--onforest)}
    #smn-account-review .panel{padding:20px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:18px}
    #smn-account-review .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
    #smn-account-review .largepreview{max-width:260px;margin:auto;min-width:0}
    #smn-account-review .note{background:var(--surface);border:1px solid var(--line);padding:25px;min-height:310px;font:400 19px/1.8 Georgia,serif}
    #smn-account-review .detailrow{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:15px;justify-content:space-between}
    #smn-account-review .detailrow span:first-child{color:var(--quiet)}
    #smn-account-review label.field{display:block;font-size:13px;margin:14px 0}
    #smn-account-review label.field input,#smn-account-review label.field select,#smn-account-review label.field textarea{display:block;width:100%;min-width:0;margin-top:6px;background:var(--surface);color:var(--ink);padding:11px;border:1px solid var(--line);border-radius:7px;font-size:16px}
    #smn-account-review .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    #smn-account-review .check{display:flex;align-items:flex-start;gap:10px;padding:12px 0;min-height:44px}#smn-account-review .check input{width:19px;height:19px;accent-color:var(--forest);flex-shrink:0;margin-top:2px}
    #smn-account-review .avatar{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--forest);font-family:Georgia,serif;flex-shrink:0}
    #smn-account-review .uploadbox{padding:35px 24px;text-align:center;border:1px dashed var(--quiet);border-radius:10px;margin-top:24px;background:var(--surface)}
    #smn-account-review .uploadbox p{margin:10px 0 18px}
    #smn-account-review .banner{background:var(--soft);padding:14px 16px;border-radius:8px;margin:18px 0}
    #smn-account-review .email{max-width:520px;margin:25px auto;background:var(--surface);border:1px solid var(--line);padding:28px}
    #smn-account-review .email p{margin:18px 0}#smn-account-review .empty{padding:55px 20px;text-align:center;border-bottom:1px solid var(--line)}
    #smn-account-review #smn-feedback{padding:12px 25px;background:var(--soft);border-top:1px solid var(--line);font-size:13px}
    #smn-account-review .footer{padding:18px 0 0;margin-top:30px;border-top:1px solid var(--line);font-size:12px;color:var(--quiet)}
    @media(max-width:800px){#smn-account-review .shell{grid-template-columns:160px minmax(0,1fr)}#smn-account-review .main{padding:25px 22px}#smn-account-review .sidebar{padding:25px 8px}#smn-account-review .grid{gap:14px}#smn-account-review .hero{grid-template-columns:minmax(0,1fr) 100px}#smn-account-review .hero .art{width:90px}}
    @media(max-width:620px){#smn-account-review .top{padding:14px 16px;gap:10px}#smn-account-review .top>.primary{display:none}#smn-account-review .brand{font-size:22px}#smn-account-review .shell{display:block}#smn-account-review .sidebar{padding:0;border-right:0;border-bottom:1px solid var(--line)}#smn-account-review .identity{display:none}#smn-account-review .navmobile{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--paper);border-radius:0;padding:13px 18px}#smn-account-review nav{display:none;padding:0 10px 12px}#smn-account-review nav.open{display:block}#smn-account-review .main{padding:24px 18px}#smn-account-review h1{font-size:29px}#smn-account-review .hero{grid-template-columns:minmax(0,1fr) 78px;gap:13px}#smn-account-review .hero .art{width:70px}#smn-account-review .hero h1{font-size:28px}#smn-account-review .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 15px}#smn-account-review .grid .tile:last-child:nth-child(3){display:none}#smn-account-review .split{grid-template-columns:1fr}#smn-account-review .listrow{gap:11px;flex-wrap:wrap}#smn-account-review .listrow>.actions{width:100%;margin-top:0;padding-left:59px}#smn-account-review .listrow>button{margin-left:59px}#smn-account-review .fields{grid-template-columns:1fr;gap:0}#smn-account-review .mainmenu{right:14px;top:70px}#smn-account-review .reviewbar{padding:7px 16px}#smn-account-review .reviewbar span:last-child{display:none}#smn-account-review .panel{padding:16px}#smn-account-review .email{padding:20px}}
  </style>
  <div class="app">
    <div class="reviewbar"><span>DESIGN REVIEW · Fictional account</span><span>November 1, 2026 · Local demo</span></div>
    <header class="top"><span class="brand">SendMyNotes</span><button class="primary" data-action="start">Send a card</button><button id="smn-menu" aria-expanded="false" aria-controls="smn-mainmenu">Menu ☰</button>
      <div class="mainmenu" id="smn-mainmenu" hidden><p class="small" style="padding:8px 14px">Signed in as Alex</p><button data-action="start">Send a card</button><button data-page="overview">Account</button><button data-page="people">Address book</button><button data-action="help">Help</button><button data-action="signout">Sign out</button></div>

    <div class="shell"><aside class="sidebar"><div class="identity"><span class="eyebrow">Your account</span><strong>Alex Morgan</strong></div><button class="navmobile" id="smn-navmobile" aria-expanded="false" aria-controls="smn-nav">Account pages <span>⌄</span></button><nav id="smn-nav" aria-label="Account pages"></nav></aside><main class="main" id="smn-content"></main></div>
    <p id="smn-feedback" role="status" aria-live="polite" hidden></p>
  </div>

    const pages=[['overview','Overview','house'],['history','Card history','mail'],['images','Saved images','image'],['people','Address book','contact-round'],['dates','Dates & reminders','calendar-days'],['drafts','Drafts','file-pen-line'],['settings','Settings','settings']];
    const state={page:'overview',imageTab:'fronts',historyFilter:'All',preview:'Front',reminder:true,paused:false,sourceSaved:false,empty:false,occasion:'Birthday',month:'November',day:'18'};
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const btn=(text,page,cls='')=>`<button class="${cls}" ${text.includes('Add a date')?'data-action="addevent"':`data-page="${page}"`}>${text}</button>`;
    const image=(key,cls='')=>`<img class="art ${cls}" src="${art[key]}" alt="${key==='meadow'?'Illustrated meadow with wildflowers':key==='birthday'?'Illustrated birthday card':'Illustrated new home card'}">`;
    const header=(title,sub,action='')=>`<div class="row between"><div><span class="eyebrow">Your account</span><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`;
    const field=(label,value,type='text')=>`<label class="field">${label}<input type="${type}" value="${value}"></label>`;
    function say(t){feedback.textContent=t;feedback.hidden=false;}
    function reminderLabel(){return state.paused?'Paused in settings':state.reminder?'Email reminder · Nov 4':'Email reminder off';}
    function eventRow(name,title,day,status,page='event'){return `<div class="listrow"><div class="dateblock"><span>Nov</span><b>${day}</b></div><div class="grow"><h3>${name}</h3><p>${title} · November ${day}</p><p class="small">${status}</p></div><div class="actions">${btn('Details',page)}<button class="link" data-action="start">Start a card</button></div></div>`;}
    function tile(key,name,subtitle,page='card'){return `<article class="tile">${image(key)}<h3>${name}</h3><p class="small">${subtitle}</p>${btn(page==='card'?'Review card':'View image',page)}</article>`;}
    function setPage(p){state.page=p;feedback.hidden=true;root.querySelector('#smn-mainmenu').hidden=true;root.querySelector('#smn-menu').setAttribute('aria-expanded','false');nav.classList.remove('open');root.querySelector('#smn-navmobile').setAttribute('aria-expanded','false');render();}
    function render(){
      const group={card:'history',asset:'images',upload:'images',source:'images',person:'people',personedit:'people',event:'dates',email:'dates',compose:'drafts'}[state.page]||state.page;
      nav.innerHTML=pages.map(([id,label,icon])=>`<button data-page="${id}" ${group===id?'aria-current="page"':''}><i data-lucide="${icon}" aria-hidden="true"></i>${label}</button>`).join('');
      let html='';
      if(state.page==='overview')html=`<div class="hero"><div><span class="eyebrow">Good morning, Alex</span><h1>A little thought<br>goes a long way.</h1><p class="sub">Your cards, favorite images, and people—all together.</p><div class="actions"><button class="primary" data-action="start">Send a card</button>${btn('Add a person','personedit')}</div></div>${image('meadow')}</div><section class="section"><div class="row between"><h2>Coming up for your people</h2>${btn('All dates','dates','link')}</div>${eventRow('Maya Chen','Birthday','18',reminderLabel())}${eventRow('Sam & Jordan','Anniversary','27','Email reminder off')}</section><section class="section"><h2>A thought in progress</h2><div class="panel row"><div class="grow"><h3>A thank-you for Maya</h3><p class="small">Note started · Saved yesterday</p></div>${btn('Continue writing','compose')}</div></section><section class="section"><div class="row between"><h2>Cards worth looking back on</h2>${btn('Card history','history','link')}</div><div class="grid">${tile('meadow','For Maya','Thank you · Mailed Oct 22')}${tile('home','For Sam & Jordan','New home · Mailed Oct 8')}${tile('birthday','For Ellis','Birthday · Mailed Sep 15')}</div></section>`;
      if(state.page==='history'){
        html=header('Card history','A little collection of the thoughts you’ve sent.')+`<div class="seg" aria-label="Filter card history">${['All','In progress','Mailed','Needs attention'].map(f=>`<button data-filter="${f}" aria-pressed="${state.historyFilter===f}">${f}</button>`).join('')}</div><label class="field">Find a recipient<input id="smn-history-search" type="search" placeholder="Search by name"></label><div id="smn-history-results">`;
        if(state.empty||state.historyFilter==='Needs attention')html+=`<div class="empty"><h2>${state.empty?'Your first card starts here.':'You’re all caught up.'}</h2><p class="sub">${state.empty?'When you send a card, you can come back and read it here.':'No cards need your attention right now.'}</p><div class="actions"><button data-action="start" class="primary">Send a card</button></div></div>`;
        else if(state.historyFilter==='In progress')html+=`<div class="listrow" data-search="maya"><div class="grow"><h3>For Maya</h3><p>Order received · November 1</p><p class="small">Preparing your card</p></div>${btn('Review card','card')}</div>`;
        else html+=`<div class="grid"><div data-search="maya">${tile('meadow','For Maya','Mailed · October 22, 2026')}</div><div data-search="sam jordan">${tile('home','For Sam & Jordan','Mailed · October 8, 2026')}</div><div data-search="ellis">${tile('birthday','For Ellis','Mailed · September 15, 2026')}</div></div>`;
        html+='</div>';
      }
      if(state.page==='card')html=btn('← Card history','history','link')+header('A thank-you for Maya','Ordered October 20, 2026 · Example order')+`<div class="seg" aria-label="Card preview">${['Front','Inside','Envelope'].map(p=>`<button data-preview="${p}" aria-pressed="${state.preview===p}">${p}</button>`).join('')}</div><div class="split"><div>${state.preview==='Front'?`<div class="largepreview">${image('meadow')}<p class="small" style="margin-top:12px">Saved card front · 4.25 × 5.5 in</p></div>`:state.preview==='Inside'?`<div class="note">Dear Maya,<br><br>Thank you for making the ordinary days feel like something to celebrate. I’m so glad you’re in my corner.<br><br>With love,<br>Alex</div><p class="small">Exact saved words · Preview, not a photo of the card</p>`:`<div class="panel"><h2>Address details</h2><p class="small">Fictional order-time snapshot</p><h3 style="margin-top:18px">To: Maya Chen</h3><p>100 Example Lane<br>Sample City, IL 00000</p><h3 style="margin-top:18px">From: Alex Morgan</h3><p>20 Example Street<br>Sample City, IL 00000</p></div>`}</div><div><span class="pill">Mailed · October 22</span><div class="detailrow"><span>Order received</span><span>October 20</span></div><div class="detailrow"><span>Handwriting</span><span>Carefree Kate</span></div><div class="detailrow"><span>Total paid</span><span>$9.00 USD</span></div><p class="small" style="margin-top:15px">Mailed status does not confirm delivery.</p><div class="actions"><button class="primary" data-action="copy">Make a similar card</button><button data-action="receipt">View receipt</button></div>${btn('View Maya in address book','person','link')}</div></div>`;
      if(state.page==='images')html=header('Saved images','Keep a front you love. Make something new from a favorite image.',`<button class="primary" data-page="${state.imageTab==='fronts'?'compose':'upload'}">${state.imageTab==='fronts'?'Create a front':'Upload image'}</button>`)+`<div class="seg" aria-label="Image library"><button data-imagetab="fronts" aria-pressed="${state.imageTab==='fronts'}">Card fronts</button><button data-imagetab="uploads" aria-pressed="${state.imageTab==='uploads'}">Uploads</button></div>`+(state.empty?`<div class="empty"><h2>A place for your favorites.</h2><p>Choose “Save to my images” after creating a front.</p></div>`:state.imageTab==='fronts'?`<div class="grid">${tile('meadow','Wildflower afternoon','Generated front · Saved Oct 20','asset')}${tile('birthday','A bright birthday','Generated front · Saved Sep 12','asset')}${tile('home','A place to call home','From an upload · Saved Oct 5','asset')}</div>`:`<p class="sub" style="margin-bottom:20px">Your source images. Make a card front before using one in a card.</p><div class="grid"><article class="tile">${image('meadow','source')}<h3>A favorite garden</h3><p class="small">Source image · Illustration stand-in</p>${btn('Make a card front','source')}</article>${state.sourceSaved?`<article class="tile">${image('home','source')}<h3>Example upload</h3><p class="small">Source image · Just saved</p>${btn('Make a card front','source')}</article>`:''}</div>`);
      if(state.page==='asset')html=btn('← Saved images','images','link')+header('Wildflower afternoon','Generated front · Saved October 20, 2026')+`<div class="split section"><div class="largepreview">${image('meadow')}</div><div><h2>Ready for another thoughtful note.</h2><p class="sub">Use this saved front without generating it again.</p><div class="actions"><button class="primary" data-action="usefront">Use this front</button><button data-action="variation">Make a variation</button></div><label class="field">Image title<input value="Wildflower afternoon" id="smn-image-title"></label><button data-action="rename">Save title</button><details style="margin-top:20px"><summary>Original prompt</summary><p class="small">A sunny meadow with wildflowers, soft painted textures, and an inviting path.</p></details><button class="link" data-action="removeimage">Remove from library</button></div></div>`;
      if(state.page==='upload')html=btn('← Saved images','images','link')+header('An image worth keeping.','Save a source image, then turn it into a personal card front.')+`<div class="uploadbox"><h2>Choose a favorite image</h2><p>JPEG, PNG or WebP · Up to 15 MB</p><button class="primary" data-action="sampleupload">Try an example image</button><p class="small">Review demo uses sample artwork. No files are uploaded.</p></div><div class="section"><h3>Your source stays separate from your card front.</h3><p class="sub">You’ll review the artwork and cover words in Upload studio before using the result.</p><p class="small" style="margin-top:15px">Use images you have permission to use. Making a front processes the image with our image-generation provider.</p></div>`;
      if(state.page==='source')html=btn('← Uploads','images','link')+header('A favorite garden','Saved source image · Private to your account')+`<div class="split section"><div class="largepreview">${image('meadow','source')}<p class="small">Source image · Not a print-ready card front</p></div><div><h2>Give this memory a new shape.</h2><label class="field">Words on the front (optional)<input value="Thank you"></label><label class="field">What would you like to change?<textarea rows="3">Turn this garden into a warm painted illustration.</textarea></label><p class="small">AI may change image details. Review the complete front before continuing.</p><div class="actions"><button class="primary" data-action="studio">Open Upload studio</button></div></div></div>`;
      if(state.page==='people')html=header('Your people.','A place for familiar addresses and dates worth remembering.',btn('Add a person','personedit','primary'))+`<label class="field">Find someone<input id="smn-people-search" type="search" placeholder="Search names"></label>`+(state.empty?`<div class="empty"><h2>Who would you like to keep in touch with?</h2><p>A name is all you need to start. Add their address and dates whenever you like.</p>${btn('Add your first person','personedit')}</div>`:`<div data-search="maya chen"><div class="listrow"><span class="avatar">MC</span><div class="grow"><h3>Maya Chen</h3><p class="small">Friend · Mailing address saved</p><p>Birthday · November 18</p></div>${btn('View person','person')}</div></div><div data-search="sam jordan"><div class="listrow"><span class="avatar">SJ</span><div class="grow"><h3>Sam & Jordan</h3><p class="small">Family · Mailing address saved</p><p>Anniversary · November 27</p></div>${btn('View person','person')}</div></div><div data-search="ellis"><div class="listrow"><span class="avatar">E</span><div class="grow"><h3>Ellis</h3><p class="small">Address needed</p><p>Birthday · September 18</p></div>${btn('Add address','personedit')}</div></div>`)+`<div class="actions"><button class="link" data-action="import">Import contacts</button></div>`;
      if(state.page==='person')html=btn('← Address book','people','link')+header('Maya Chen','Friend · Last card mailed October 22',`<button class="primary" data-action="start">Send Maya a card</button>`)+`<div class="split section"><div><h2>Mailing address</h2><div class="panel"><p>Maya Chen<br>100 Example Lane<br>Sample City, IL 00000</p><p class="small">Fictional address</p>${btn('Edit person','personedit','link')}</div><h2 style="margin-top:25px">Your notes</h2><p class="sub">Loves gardening and a good cup of tea.</p></div><div><h2>Important dates</h2>${eventRow('Birthday','Every year','18',reminderLabel())}<div class="listrow"><div class="dateblock"><span>Jun</span><b>6</b></div><div class="grow"><h3>Anniversary</h3><p class="small">Every year · Email reminder off</p></div></div>${btn('+ Add a date','event','link')}</div></div><div class="section"><h2>Cards to Maya</h2><div class="listrow"><div class="grow"><h3>A thank-you for Maya</h3><p class="small">Mailed October 22, 2026</p></div>${btn('Review card','card')}</div></div>`;
      if(state.page==='personedit')html=btn('← Address book','people','link')+header('A place for someone special.','Start with a name. Everything else can wait.')+`<div class="fields">${field('Name','Maya Chen')}${field('Relationship or label (optional)','Friend')}</div><details open><summary>Mailing address (optional)</summary>${field('Mailing name','Maya Chen')}${field('Street address','100 Example Lane')}${field('Apartment / unit (optional)','')}<div class="fields">${field('City','Sample City')}${field('State / region','Illinois')}</div><div class="fields">${field('Postal code','00000')}${field('Country','United States')}</div><p class="small">Fictional values for design review.</p></details><label class="field">Your notes (optional)<textarea rows="2">Loves gardening and a good cup of tea.</textarea></label><div class="actions"><button class="primary" data-action="saveperson">Save person</button>${btn('Cancel','people')}</div><p class="small" style="margin-top:15px">Add birthdays and other dates after saving.</p>`;
      if(state.page==='dates')html=header('Dates worth remembering.','A little nudge, with time to make it personal.',btn('Add a date','event','primary'))+`<div class="banner">${state.paused?'Occasion emails are paused in Settings.':`Reminder emails go to alex@example.com · 14 days before.`} ${btn('Preferences','settings','link')}</div><section class="section"><h2>November 2026</h2>${eventRow('Maya Chen',esc(state.occasion),'18',reminderLabel())}${eventRow('Sam & Jordan','Anniversary','27','Email reminder off')}</section><section class="section"><h2>December 2026</h2><div class="listrow"><div class="dateblock"><span>Dec</span><b>12</b></div><div class="grow"><h3>Robin</h3><p>Birthday · December 12</p><p class="small">Email reminder off</p></div>${btn('Details','event')}</div></section><p class="small section">You choose when to send. Reminders don’t place orders or guarantee an arrival date.</p>`;
      if(state.page==='event')html=btn('← Dates & reminders','dates','link')+header('Make room for their day.','Save the date, with an optional email nudge.')+`<div class="fields"><label class="field">Person<select><option>Maya Chen</option><option>Sam & Jordan</option></select></label><label class="field">Occasion<select id="smn-occasion">${['Birthday','Anniversary','Other'].map(o=>`<option ${state.occasion===o?'selected':''}>${o}</option>`).join('')}</select></label></div><div class="fields"><label class="field">Month<select id="smn-month"><option>November</option><option>December</option></select></label><label class="field">Day<input id="smn-day" type="number" min="1" max="31" value="${esc(state.day)}"></label></div>${field('Original year (optional)','','number')}<label class="check"><input type="checkbox" checked>Repeats every year</label><div class="panel"><label class="check"><input type="checkbox" id="smn-reminder" ${state.reminder?'checked':''}><span>Email me 14 days before<br><span class="small">To alex@example.com · Verified account email</span></span></label><p class="small" id="smn-reminder-next">${state.paused?'Paused in settings. Your date stays saved.':state.reminder?'Next email: November 4, 2026 at 9 a.m. · America/Chicago':'Your date stays saved with no reminder email.'}</p><p class="small" style="margin-top:10px">You choose whether and when to send a card.</p></div><div class="actions"><button class="primary" data-action="savedate">Save date</button>${btn('Preview reminder email','email')}</div>`;
      if(state.page==='email')html=btn('← Back to the date','event','link')+header('A gentle reminder.','Example email preview · Nothing will be sent')+`<div class="email"><span class="eyebrow">SendMyNotes</span><p class="small">To: alex@example.com<br>Subject: Maya’s birthday is in two weeks.</p><h1>Someone special.<br>A day to remember.</h1><p>Maya’s birthday is November 18. A little note can make it feel special.</p><button class="primary" data-action="start">Start a birthday card</button><p class="small">You’re receiving this because you asked for an occasion reminder. You choose whether to send a card.</p>${btn('Manage this date','event','link')}<br><button class="link" data-action="unsubscribe">Stop occasion reminders</button></div>`;
      if(state.page==='drafts')html=header('Thoughts in progress.','Pick up where you left off.')+`<div class="banner small">Proposed account saving · These screens need durable cross-device draft storage.</div><div class="listrow"><div style="width:72px">${image('meadow')}</div><div class="grow"><h3>A thank-you for Maya</h3><p>Note started</p><p class="small">Saved yesterday · Kept for 90 days of inactivity</p></div>${btn('Continue writing','compose')}</div>`;
      if(state.page==='compose')html=btn('← Account','overview','link')+header('A thank-you for Maya','Draft preview · Continue through review and checkout to send')+`<div class="split section"><div class="largepreview">${image('meadow')}<button class="link" data-action="savefront">Save to my images</button></div><div><label class="field">Your note<textarea rows="7">Dear Maya,\n\nThank you for making the ordinary days feel like something to celebrate.\n\nWith love,\nAlex</textarea></label><p class="small">Draft demonstration · No order has been placed.</p><div class="actions"><button class="primary" data-action="savedraft">Save draft</button>${btn('Choose someone from address book','people')}</div></div></div>`;
      if(state.page==='settings')html=header('Make yourself at home.','The details that make sending easier.')+`<section class="section"><h2>Your profile</h2><div class="detailrow"><span>Name</span><span>Alex Morgan</span></div><div class="detailrow"><span>Email</span><span>alex@example.com</span></div><div class="detailrow"><span>Sign-in</span><span>Google</span></div></section><section class="section"><h2>Default return address</h2><p class="sub">Your name and personal address appear on the envelope.</p><div class="panel"><p>Alex Morgan<br>20 Example Street<br>Sample City, IL 00000</p><p class="small">Fictional address</p><button class="link" data-action="returnaddress">Edit return address</button></div></section><section class="section"><h2>Emails & time zone</h2><label class="field">Reminder time zone<select><option>America/Chicago · Central Time</option><option>America/New_York · Eastern Time</option><option>America/Los_Angeles · Pacific Time</option></select></label><label class="check"><input id="smn-pause" type="checkbox" ${state.paused?'checked':''}><span>Pause all occasion reminders<br><span class="small">Your dates stay saved. Order updates continue.</span></span></label><button data-action="savesettings" class="primary">Save preferences</button></section><section class="section"><h2>Privacy & account</h2><div class="actions"><button data-action="export">Request my data</button><button data-action="deleteaccount">Delete account</button><button data-action="signout">Sign out</button></div></section>`;
      content.innerHTML=html+`<div class="footer">SendMyNotes · A thoughtful gesture, made seamless.</div>`;
      if(globalThis.lucide)lucide.createIcons();
    }
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.id==='smn-menu'){const m=root.querySelector('#smn-mainmenu');m.hidden=!m.hidden;b.setAttribute('aria-expanded',String(!m.hidden));return;}
      if(b.id==='smn-navmobile'){const open=nav.classList.toggle('open');b.setAttribute('aria-expanded',String(open));return;}
      if(b.dataset.page){setPage(b.dataset.page);return;}
      if(b.dataset.filter){state.historyFilter=b.dataset.filter;render();return;}
      if(b.dataset.preview){state.preview=b.dataset.preview;render();return;}
      if(b.dataset.imagetab){state.imageTab=b.dataset.imagetab;render();return;}
      const a=b.dataset.action;
      if(a==='start'||a==='copy'||a==='usefront'||a==='variation'){setPage('compose');say(a==='copy'?'Demo: copied into a new editable draft. Choose the recipient and review current pricing before sending.':a==='variation'?'Demo: variation editor opened. Generation would require an explicit request.':'Demo: opened a new editable draft. Nothing has been sent.');}
      else if(a==='sampleupload'){state.sourceSaved=true;setPage('source');say('Example source saved in the demo. No real file was uploaded.');}
      else if(a==='studio'){say('Upload studio handoff: the source, exact cover words and instructions would open for composition and review. No image generation ran.');}
      else if(a==='saveperson'){setPage('person');say('Person saved in the demo. Add a birthday or anniversary in Important dates.');}
      else if(a==='addevent'){state.reminder=false;setPage('event');say('New-date example: email reminders start off. Choose whether to enable one.');}
      else if(a==='savedate'){state.occasion=root.querySelector('#smn-occasion').value;state.day=root.querySelector('#smn-day').value;if(state.day!=='18'||root.querySelector('#smn-month').value!=='November'){say('This review fixture illustrates November 18. The build spec covers all dates, recurrence and validation.');return;}setPage('dates');say('Demo date saved. '+(state.reminder&&!state.paused?'The example reminder is November 4. No email was scheduled.':'No reminder email will be scheduled in this demo.'));}
      else if(a==='unsubscribe'){state.paused=true;say('Demo: occasion reminders paused. Order updates remain separate.');}
      else if(a==='savesettings'){say('Preferences updated in the demo. '+(state.paused?'All occasion reminders are paused.':'Per-date reminder choices apply.'));}
      else if(a==='rename'){say('Demo title: '+root.querySelector('#smn-image-title').value);}
      else if(a==='removeimage'){say('Removal confirmation: remove this image from your library? Existing orders retain their artwork. No removal has been made in this review.');}
      else if(a==='savefront'){say('Demo: front saved to Saved images. Reuse would not generate it again.');}
      else if(a==='savedraft'){say('Demo: draft saved. No payment or fulfillment was started.');}
      else if(a==='import'){say('Import flow: choose a contacts file → review fields and duplicates → select create, update or skip. Reminder opt-in is separate.');}
      else if(a==='receipt'){say('Receipt would open the owner-authorized receipt for this order. This is fictional order data.');}
      else if(a==='returnaddress'){setPage('personedit');say('Return-address editing uses the same address fields; this fixture shows the contact form.');}
      else if(a==='deleteaccount'){say('Account deletion opens a separate confirmation explaining the data removed and required order-record retention. No deletion requested.');}
      else if(a==='export'){say('A data export request would be verified and prepared privately. No request submitted.');}
      else if(a==='signout'){say('Sign-out demo: the menu would switch to Sign in. No live account is connected.');}
      else if(a==='help'){say('Help opens support; card-specific help includes its order reference only after authorization.');}
    });
    root.addEventListener('input',e=>{if(e.target.id==='smn-history-search'||e.target.id==='smn-people-search'){content.querySelectorAll('[data-search]').forEach(el=>{el.hidden=!el.dataset.search.includes(e.target.value.toLowerCase().trim());});}});
    root.addEventListener('change',e=>{if(e.target.id==='smn-reminder'){state.reminder=e.target.checked;root.querySelector('#smn-reminder-next').textContent=state.paused?'Paused in settings. Your date stays saved.':state.reminder?'Next email: November 4, 2026 at 9 a.m. · America/Chicago':'Your date stays saved with no reminder email.';}if(e.target.id==='smn-pause')state.paused=e.target.checked;});
    root.addEventListener('keydown',e=>{if(e.key==='Escape'){root.querySelector('#smn-mainmenu').hidden=true;root.querySelector('#smn-menu').setAttribute('aria-expanded','false');}});
    render();
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(state,'empty',{label:'New account: empty collections'});}
  })();
  </script>
</div>
