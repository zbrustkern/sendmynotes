    @media(max-width:760px){#smn-followup-mock .smn-split,#smn-followup-mock .smn-settinggrid,#smn-followup-mock .smn-editgrid{grid-template-columns:1fr}#smn-followup-mock .smn-main{padding:20px 16px}#smn-followup-mock .smn-brandbar{padding-left:16px}#smn-followup-mock .smn-nav{gap:15px;padding:10px 16px}#smn-followup-mock .smn-brandtag{display:none}#smn-followup-mock .smn-person{padding:12px 16px}#smn-followup-mock .smn-people{display:grid;grid-template-columns:1fr}#smn-followup-mock .smn-email{padding:22px;margin:10px}#smn-followup-mock .smn-heading p{max-width:420px}}
    @media(max-width:420px){#smn-followup-mock .smn-nav span:nth-last-child(-n+2){display:none}#smn-followup-mock .smn-fields{grid-template-columns:1fr}#smn-followup-mock .smn-step{grid-template-columns:24px 1fr}#smn-followup-mock .smn-step>.smn-link{grid-column:2}#smn-followup-mock .smn-btn{padding:10px 11px}#smn-followup-mock .smn-tabs{gap:3px}#smn-followup-mock .smn-tab{padding:8px}#smn-followup-mock .smn-brand{font-size:16px}#smn-followup-mock .smn-panel{padding:16px}#smn-followup-mock .smn-people{padding:0}#smn-followup-mock .smn-facts{grid-template-columns:1fr 1fr}#smn-followup-mock .smn-emailbrand{font-size:20px}#smn-followup-mock .smn-demo{padding:9px 16px}}

  <header class="smn-brandbar"><div class="smn-logo">SMN</div><div><div class="smn-brand">SendMyNotes Admin</div><div class="smn-mini">Orders &amp; customer care</div></div><span class="smn-badge smn-brandtag">Design preview</span></header>
  <div class="smn-nav" aria-label="Existing admin navigation"><span>Overview</span><strong>Orders</strong><span>Journeys</span><span>Economics</span><span>Promotions</span><span>Growth</span></div>
  <div class="smn-demo"><span>Interactive concept · fictional customers and orders</span><span>No emails, payments or codes are created</span></div>
  <main class="smn-main"><div id="smn-mock-content"></div></main>
  <div class="smn-status" id="smn-mock-status" role="status" aria-live="polite"></div>
  <script>
  (()=>{
    const root=document.getElementById('smn-followup-mock');
    const content=root.querySelector('#smn-mock-content');
    const status=root.querySelector('#smn-mock-status');
    const initial={page:'orders',person:'alex',detail:'timeline',email:'check',editor:null,mode:'review',paused:false,check:true,offer:true,checkDelay:10,offerDelay:7,anchor:'check',hour:'10',scheduled:false,hold:false,confirmed:false,customer:'checkout',unsubscribed:false,opted:false,version:1,confirm:null,mobile:false,subjectCheck:'A quick check-in from Zeke at SendMyNotes',subjectOffer:'$1 off a little note for someone on your mind',previewCheck:"I'd love to hear how sending your card went.",previewOffer:'A thank-you from SendMyNotes. Use it yourself or pass it along.',bodyCheck:"Zeke here, founder of SendMyNotes. Thank you for trusting us with your card.\n\nIf you've heard from the person you sent it to, I'd love to know how it went. Was there anything about sending it that felt confusing or harder than it should have?\n\nJust reply here—I read these myself.",bodyOffer:"A thank-you, a birthday wish, or simply a little hello—someone else may be on your mind.\n\nAs a thank-you for trying SendMyNotes, here's $1 off one card.",cta:'Send another card'};
    let s={...initial};let published={...initial};
    const stored=window.openai?.widgetState?.privateContent;
    if(stored?.schema===1){s={...initial,...stored.state};published={...initial,...stored.published};}
    const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const para=x=>esc(x).split('\n\n').map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
    const btn=(label,action,primary=false,disabled=false)=>`<button class="smn-btn ${primary?'primary':''}" data-act="${action}" ${disabled?'disabled':''}>${label}</button>`;
    function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{mockup:'SendMyNotes follow-ups',view:s.page,enrollmentMode:s.mode,checkInEnabled:s.check,offerEnabled:s.offer,checkInDelay:s.checkDelay,offerDelay:s.offerDelay},privateContent:{schema:1,state:s,published}}).catch(()=>{});}
    function say(msg){status.textContent=msg;}
    const tabs=()=>`<div class="smn-tabs" aria-label="Mockup screens">${[['orders','Confirmed orders'],['settings','Follow-up settings'],['customer','Customer views']].map(([id,label])=>`<button class="smn-tab" aria-pressed="${s.page===id}" data-page="${id}">${label}</button>`).join('')}</div>`;
    function emailMarkup(kind='check',cfg=s){
      const offer=kind==='offer',receipt=kind==='receipt';
      const subject=receipt?'Thanks—your SendMyNotes order is confirmed':offer?cfg.subjectOffer:cfg.subjectCheck;
      return `<div class="smn-emailwrap ${s.mobile?'smn-preview-mobile':''}"><div class="smn-envelopehead"><div class="smn-mini">From: ${receipt?'SendMyNotes':'Zeke at SendMyNotes'} · To: Alex (example)</div><div style="margin-top:6px">${esc(subject)}</div></div><article class="smn-email"><div class="smn-emailbrand">SendMyNotes<span style="color:var(--smn-gold-ink)">.</span></div><p>Hi Alex,</p>${receipt?'<p>Thank you for trusting SendMyNotes with your card.</p><p>Payment received: <strong>$9.00</strong><br>Order: DEMO-A</p><p>We have your order. Preparation and mailing updates will appear on your order page.</p>'+btn('View your order','sample-order',true)+'<p style="margin-top:16px">Have a question or need help? Reply to this email.</p>':para(offer?cfg.bodyOffer:cfg.bodyCheck)}${offer?btn(esc(cfg.cta),'sample-cta',true)+'<div class="smn-code">THANKS-EXAMPLE<br><span class="smn-mini">Preview code · not redeemable</span></div><p>Use it yourself or pass the code to a friend. No account needed.</p><p class="smn-mini">One redemption total, by you or a friend, through the displayed expiration date. Valid for 60 days. Cannot be combined with another offer.</p>':''}<p style="margin-top:18px">Thanks,<br>${receipt?'SendMyNotes':'Zeke<br>Founder, SendMyNotes'}</p>${!receipt?`<div class="smn-mailfooter">${offer?'This is a promotional offer from SendMyNotes.<br>':''}You're receiving this because you chose SendMyNotes follow-ups and offers.<br><button class="smn-link" data-act="unsubscribe-preview" style="margin:8px 0">Stop follow-ups and offers</button><br>Order receipts and necessary order updates will continue.<br><br>SendMyNotes · [verified business postal address]</div>`:''}</article></div>`;
    }
    function orders(){
      const p=s.person;const ready=p==='alex',missing=p==='sam';
      const name=ready?'Alex':missing?'Sam':'Jamie';
      const label=ready?(s.hold?'Paused for support':s.scheduled?'Scheduled':'Ready to review'):missing?'Missing email':'Permission unknown';
      return `<div class="smn-heading"><div><div class="smn-eyebrow">Orders / Follow-ups</div><h1 style="margin-top:6px">A thoughtful next step.</h1><p>Review a customer's experience, then invite them to send again.</p></div>${btn('Flow settings','settings')}</div>${tabs()}<div class="smn-split"><section class="smn-panel smn-people" aria-label="Sample confirmed orders"><div class="smn-listhead"><h3>Confirmed orders</h3><span class="smn-mini">Select an example to inspect its follow-up</span></div>${[['alex','Alex','a•••@example.com','Opted-in example','DEMO-A'],['jamie','Jamie','j•••@example.com','Receipt-only example','DEMO-B'],['sam','Sam','No email provided','No-email example','DEMO-C']].map(([id,n,e,t,o])=>`<button class="smn-person ${p===id?'selected':''}" data-person="${id}" aria-pressed="${p===id}"><div class="smn-row smn-spread"><strong>${n}</strong><span class="smn-mini">$9.00 · Paid</span></div><span class="smn-mini">${o} · Google · ${e}</span><span class="smn-badge ${id==='alex'?'good':'hold'}">${t}</span></button>`).join('')}<div class="smn-listhead smn-mini">Fictional examples. Existing receipt-only customers would show a permission hold.</div></section><section class="smn-panel" aria-label="Order follow-up details"><div class="smn-row smn-spread"><div><div class="smn-eyebrow">${ready?'DEMO-A':missing?'DEMO-C':'DEMO-B'} / 1 card</div><h2 style="margin-top:5px">${name}'s follow-up</h2></div><span class="smn-badge ${ready&&!s.hold?'good':'hold'}">${label}</span></div><div class="smn-facts"><div><span class="smn-mini">Email permission</span><span>${ready?'Recorded at checkout':missing?'No email address':'Not recorded'}</span></div><div><span class="smn-mini">Mailing evidence</span><span>${ready?'Oct 20 · supplier confirmed':'Awaiting verification'}</span></div></div>${!ready?`<div class="smn-notice"><strong>${missing?'There is no email to follow up with.':'An order email is not a marketing subscription.'}</strong><br>${missing?'This order can stay in the normal order workflow.':'Optional emails stay on hold until actual permission is recorded. Receipts and necessary order updates continue.'}</div>`:s.hold?'<div class="smn-notice">Support issue recorded. Future follow-ups are paused.</div>':'<div class="smn-mini">Review-first mode · Published flow v'+s.version+' · Times in Chicago</div>'}<div class="smn-tabs" style="margin-top:18px;margin-bottom:4px" aria-label="Order detail"><button class="smn-tab" data-detail="timeline" aria-pressed="${s.detail==='timeline'}">Sequence</button><button class="smn-tab" data-detail="preview" aria-pressed="${s.detail==='preview'}">Email preview</button><button class="smn-tab" data-detail="offer" aria-pressed="${s.detail==='offer'}">Offer &amp; results</button></div>${s.detail==='preview'?`<div class="smn-row" style="margin:14px 0">${btn('Check-in','preview-check')}${btn('Next-card offer','preview-offer')}</div>${emailMarkup(s.email,published)}`:s.detail==='offer'?`<div style="padding:18px 0"><h3>$1 off one card</h3><p class="smn-muted" style="margin-top:8px">One use total · 60 days · Shareable · No account needed</p><div class="smn-code">Code created when the offer is ready to send</div><div class="smn-divider"></div><div class="smn-row smn-spread"><span>Original acquisition</span><strong>Google</strong></div><div class="smn-row smn-spread" style="margin-top:10px"><span>Related paid order</span><span class="smn-muted">None in this example</span></div><p class="smn-mini" style="margin-top:14px">A later purchase will show its code association separately from the original acquisition source.</p></div>`:`<div class="smn-step"><span class="smn-dot">✓</span><div><h3>Order thank-you</h3><p>Included in the receipt · already sent in this example</p></div><button class="smn-link" data-act="receipt-preview">Preview</button></div><div class="smn-step"><span class="smn-dot">1</span><div><h3>Experience check-in</h3><p>${ready?'Nov 3 · 10:00 a.m.':'Waiting for eligibility'}</p><p>10 business days after mailing</p></div><button class="smn-link" data-act="preview-check">Preview</button></div><div class="smn-step"><span class="smn-dot">2</span><div><h3>Next-card offer</h3><p>${ready?'Nov 10 · 10:00 a.m. (estimated)':'Waiting for eligibility'}</p><p>7 days after check-in is accepted</p></div><button class="smn-link" data-act="preview-offer">Preview</button></div>`}${s.confirm==='schedule'?`<div class="smn-confirm"><h3>Schedule this sequence?</h3><p class="smn-mini" style="margin-top:8px">Alex · two optional emails · flow v${s.version}. Permission and order status are checked again before each send.</p><div class="smn-row">${btn('Confirm schedule','confirm-schedule',true)}${btn('Go back','dismiss')}</div></div>`:''}<div class="smn-footer"><div class="smn-row">${s.scheduled&&ready?btn('Cancel follow-ups','cancel'):btn('Review & schedule','schedule',true,!ready||s.hold||s.paused)}${btn('Test preview to me','test')}${ready?btn(s.hold?'Resolve issue':'Record reply / issue',s.hold?'resolve':'issue'):''}</div><div class="smn-mini" style="margin-top:9px">${ready?'A new purchase or unsubscribe stops remaining optional emails.':'Scheduling is unavailable while this order is held.'}</div></div></section></div>`;
    }
    function settings(){
      if(s.editor)return editor();
      const invalid=s.offer&&!s.check&&s.anchor==='check';
      return `<div class="smn-heading"><div><div class="smn-eyebrow">Orders / Follow-up settings</div><h1 style="margin-top:6px">First purchase, next gesture.</h1><p>Two emails. Clear controls. Start with a personal review.</p></div><span class="smn-badge">Published v${s.version} · Draft settings</span></div>${tabs()}<div class="smn-settinggrid"><div class="smn-stack"><section class="smn-panel"><h3>How customers enter the flow</h3><label class="smn-option"><input type="radio" name="smn-mode" value="review" data-key="mode" ${s.mode==='review'?'checked':''}><span>Review first <span class="smn-badge">Initial default</span><small>Approve each eligible customer's sequence from Orders.</small></span></label><label class="smn-option"><input type="radio" name="smn-mode" value="auto" data-key="mode" ${s.mode==='auto'?'checked':''}><span>Automatically enroll future eligible buyers<small>Only new eligible first purchases. No historical backfill.</small></span></label><div class="smn-mini" style="margin-top:12px">Both modes require recorded email permission.</div></section><section class="smn-panel"><div class="smn-row smn-spread"><div class="smn-row"><span class="smn-dot">1</span><h3>Experience check-in</h3></div><label class="smn-check"><input type="checkbox" data-key="check" ${s.check?'checked':''}>Enabled</label></div><p class="smn-mini" style="margin-top:12px">Ask about the experience. Replies go directly to you.</p><div class="smn-fields"><label>Delay after mailing<input type="number" min="10" max="90" data-key="checkDelay" value="${s.checkDelay}"><span class="smn-mini">Business days · minimum 10</span></label><label>Send time<select data-key="hour">${['9','10','11','12','13','14','15','16','17'].map(h=>`<option value="${h}" ${s.hour===h?'selected':''}>${+h>12?+h-12:h}:00 ${+h>=12?'p.m.':'a.m.'}</option>`).join('')}</select><span class="smn-mini">America/Chicago · both steps</span></label></div>${btn('Edit email & preview','edit-check')}</section><section class="smn-panel"><div class="smn-row smn-spread"><div class="smn-row"><span class="smn-dot">2</span><h3>Next-card offer</h3></div><label class="smn-check"><input type="checkbox" data-key="offer" ${s.offer?'checked':''}>Enabled</label></div><p class="smn-mini" style="margin-top:12px">One invitation to send again, with a shareable $1 code.</p><div class="smn-fields"><label>Send after<select data-key="anchor"><option value="check" ${s.anchor==='check'?'selected':''}>Check-in accepted</option><option value="mail" ${s.anchor==='mail'?'selected':''}>Mailing date</option></select></label><label>Delay<input type="number" min="${s.anchor==='mail'?10:7}" max="90" data-key="offerDelay" value="${s.offerDelay}"><span class="smn-mini">${s.anchor==='mail'?'Business':'Calendar'} days</span></label></div>${invalid?'<div class="smn-notice" role="alert">The check-in is off. Choose “Mailing date” or turn the offer off before publishing.</div>':''}${btn('Edit email & preview','edit-offer')}</section></div><aside class="smn-stack"><section class="smn-panel"><h3>At a glance</h3><div class="smn-flowline">Payment confirmed<br><strong style="color:var(--smn-ink)">Receipt & thank-you</strong><br>Always on</div><div class="smn-flowline">${s.check?'After '+s.checkDelay+' business days':'Disabled'}<br><strong style="color:var(--smn-ink)">Experience check-in</strong></div><div class="smn-flowline">${s.offer?'After '+s.offerDelay+' '+(s.anchor==='mail'?'business days from mailing':'days from check-in'):'Disabled'}<br><strong style="color:var(--smn-ink)">Next-card offer</strong></div><div class="smn-divider"></div><div class="smn-mini">$1 off · one use · 60 days<br>Code created only when needed</div></section><section class="smn-panel"><label class="smn-check"><input type="checkbox" data-key="paused" ${s.paused?'checked':''}>Pause all optional delivery</label><p class="smn-mini" style="margin-top:10px;margin-bottom:0">A live pause stops pending optional messages. Receipts and unsubscribe keep working.</p></section><section class="smn-panel"><h3>Safe to adjust</h3><p class="smn-mini" style="margin-top:10px;margin-bottom:0">Published changes apply to new enrollments. Previously reviewed messages keep their approved copy and dates.</p></section></aside></div>${s.confirm==='publish'?`<section class="smn-confirm"><h3>Publish flow v${s.version+1}?</h3><ul class="smn-summary"><li>${s.mode==='review'?'Reviewed enrollment':'Automatic enrollment for future eligible buyers'}</li><li>Check-in ${s.check?'on':'off'}; offer ${s.offer?'on':'off'}.</li><li>New enrollments use this copy and timing. Existing approved messages keep their version.</li></ul><div class="smn-row">${btn('Publish version','confirm-publish',true,invalid)}${btn('Keep editing','dismiss')}</div></section>`:''}<div class="smn-footer smn-row smn-spread"><span class="smn-mini">No change enables live sending in this preview.</span><div class="smn-row">${btn('Save draft','save-draft')}${btn('Review & publish','publish',true,invalid)}</div></div>`;
    }
    function editor(){const k=s.editor,offer=k==='offer';return `<div class="smn-heading"><div>${btn('← Flow settings','back-settings')}<h1 style="margin-top:16px">${offer?'Next-card offer':'Experience check-in'}</h1><p>Edit the message. Preview exactly what the customer will see.</p></div><span class="smn-badge">Draft · not sent</span></div>${tabs()}<div class="smn-editgrid"><section class="smn-panel"><div class="smn-stack"><label>Subject<input type="text" data-key="${offer?'subjectOffer':'subjectCheck'}" value="${esc(offer?s.subjectOffer:s.subjectCheck)}"></label><label>Preview text<input type="text" data-key="${offer?'previewOffer':'previewCheck'}" value="${esc(offer?s.previewOffer:s.previewCheck)}"></label><label>Message<textarea data-key="${offer?'bodyOffer':'bodyCheck'}" rows="9">${esc(offer?s.bodyOffer:s.bodyCheck)}</textarea></label>${offer?`<label>Button label<input type="text" data-key="cta" value="${esc(s.cta)}"></label>`:''}<div class="smn-mini">Greeting and signature are added automatically. The footer, unsubscribe link and offer terms stay protected.</div></div><div class="smn-footer smn-row">${btn('Done editing','back-settings',true)}${btn('Test preview to me','test')}</div></section><section aria-label="Live email preview"><div class="smn-row smn-spread" style="margin-bottom:12px"><span class="smn-eyebrow">Customer preview</span><button class="smn-btn" data-act="mobile">${s.mobile?'Desktop width':'Phone width'}</button></div><div id="smn-live-email">${emailMarkup(k)}</div></section></div>`;}
    function customer(){return `<div class="smn-heading"><div><div class="smn-eyebrow">Customer touchpoints</div><h1 style="margin-top:6px">Optional at every step.</h1><p>Guest checkout, clear choices, and an easy way to stop.</p></div></div>${tabs()}<div class="smn-row smn-customer-tabs">${[['checkout','Checkout opt-in'],['receipt','Receipt'],['check','Check-in email'],['offer','Offer email'],['unsubscribe','Unsubscribe']].map(([id,l])=>`<button class="smn-btn ${s.customer===id?'primary':''}" data-customer="${id}">${l}</button>`).join('')}</div>${s.customer==='checkout'?`<section class="smn-panel smn-center"><div class="smn-emailbrand">SendMyNotes.</div><div class="smn-eyebrow">Final step / Checkout excerpt</div><div class="smn-customer-title">Ready to make their day?</div><div class="smn-row smn-spread" style="margin:20px 0"><span>Your card, written & mailed</span><strong>$9.00</strong></div><label>Email for your receipt<input type="text" value="alex@example.com" readonly></label><label class="smn-check" style="margin:18px 0;align-items:start"><input type="checkbox" data-key="opted" ${s.opted?'checked':''}><span>Email me a follow-up about my card and occasional SendMyNotes offers.<small class="smn-muted" style="display:block;margin-top:5px">Optional. Unsubscribe anytime.</small></span></label><div class="smn-divider"></div>${btn('Continue to payment','sample-payment',true)}<div class="smn-mini" style="margin-top:12px">No account needed.</div></section>`:s.customer==='unsubscribe'?`<section class="smn-panel smn-center" style="padding:34px"><div class="smn-emailbrand">SendMyNotes.</div>${s.unsubscribed?'<div class="smn-successmark">✓</div><h2>You’re unsubscribed.</h2><p style="margin-top:16px">You won’t receive SendMyNotes follow-ups or offers.</p><p class="smn-muted">Your order receipts and necessary order updates will continue.</p>'+btn('Show unsubscribe form','reset-unsub'):'<h2>Stop follow-ups and offers?</h2><p class="smn-muted" style="margin-top:16px">You will still receive receipts and necessary updates about your orders.</p>'+btn('Stop follow-ups and offers','unsubscribe',true)}<div class="smn-mini" style="margin-top:22px">No account or sign-in required.</div></section>`:`<div class="smn-center">${emailMarkup(s.customer)}</div>`}`;}
    function render(){content.innerHTML=s.page==='settings'?settings():s.page==='customer'?customer():orders();}
    function validate(){return s.checkDelay>=10&&s.checkDelay<=90&&s.offerDelay>=(s.anchor==='mail'?10:7)&&s.offerDelay<=90&&(!s.offer||s.check||s.anchor==='mail')&&s.subjectCheck.trim()&&s.subjectOffer.trim()&&s.bodyCheck.trim()&&s.bodyOffer.trim()&&s.cta.trim();}
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.dataset.page){s.page=b.dataset.page;s.editor=null;s.confirm=null;}
      if(b.dataset.person){s.person=b.dataset.person;s.detail='timeline';s.confirm=null;}
      if(b.dataset.detail)s.detail=b.dataset.detail;
      if(b.dataset.customer)s.customer=b.dataset.customer;
      const a=b.dataset.act;
      if(a==='settings'){s.page='settings';s.editor=null;}
      if(a==='edit-check'||a==='edit-offer')s.editor=a==='edit-offer'?'offer':'check';
      if(a==='back-settings')s.editor=null;
      if(a==='preview-check'||a==='preview-offer'){s.detail='preview';s.email=a==='preview-offer'?'offer':'check';}
      if(a==='receipt-preview'){s.detail='preview';s.email='receipt';}
      if(a==='mobile')s.mobile=!s.mobile;
      if(a==='test')say('Preview only: a real test would use your configured inbox and synthetic order data. No email sent.');
      if(a==='schedule')s.confirm='schedule';
      if(a==='confirm-schedule'){s.scheduled=true;s.confirm=null;say('Demo: Alex’s reviewed sequence is now shown as scheduled. No live job was created.');}
      if(a==='cancel'){s.scheduled=false;say('Demo: Alex’s optional follow-ups were cancelled.');}
      if(a==='issue'){s.hold=true;say('Demo: a reply with an issue is recorded; remaining emails are paused.');}
      if(a==='resolve'){s.hold=false;say('Demo: issue resolved. Review the schedule before resuming.');}
      if(a==='dismiss')s.confirm=null;
      if(a==='save-draft')say('Demo draft saved. Published settings and previously reviewed messages are unchanged.');
      if(a==='publish'){if(validate())s.confirm='publish';else say('Check the timing ranges and required email fields before publishing.');}
      if(a==='confirm-publish'){s.version++;published={...s};s.confirm=null;say('Demo: flow v'+s.version+' published for new enrollments. No live settings changed.');}
      if(a==='unsubscribe-preview'){s.page='customer';s.customer='unsubscribe';}
      if(a==='unsubscribe'){s.unsubscribed=true;say('Demo unsubscribe complete. No real preferences were changed.');}
      if(a==='reset-unsub')s.unsubscribed=false;
      if(a==='sample-cta')say('Preview only: this would open guest checkout with the $1 code applied.');
      if(a==='sample-payment')say('Preview only: checkout can continue '+(s.opted?'with optional email permission.':'without opting into follow-ups.'));
      if(a==='sample-order')say('Preview only: this would open the customer’s secure order page.');
      render();save();
    });
    root.addEventListener('input',e=>{const k=e.target.dataset.key;if(!k||!['text','textarea'].includes(e.target.type))return;s[k]=e.target.value;const live=root.querySelector('#smn-live-email');if(live)live.innerHTML=emailMarkup(s.editor);save();});
    root.addEventListener('change',e=>{const k=e.target.dataset.key;if(!k)return;s[k]=e.target.type==='checkbox'?e.target.checked:e.target.type==='number'?Number(e.target.value):e.target.value;if(k==='anchor')s.offerDelay=s.anchor==='mail'?15:7;if(k==='paused')say(s.paused?'Demo: optional delivery paused; receipts and unsubscribe remain available.':'Demo: pause lifted. Overdue held messages would still require review.');render();save();});
    window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.privateContent;if(v?.schema===1){s={...initial,...v.state};published={...initial,...v.published};render();}});
    render();
    if(globalThis.Tweak){const design={spacing:'Comfortable'};const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--smn-pad',design.spacing==='Compact'?'16px':'22px')});tweak.addSelect(design,'spacing',{label:'Panel spacing',options:['Comfortable','Compact']});}
  })();
  </script>
</div>
